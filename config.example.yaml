timezone: Europe/Paris

locations:
  home:
    # Put real values in ignored config.yaml, never in this tracked example.
    latitude: 0.0
    longitude: 0.0
  work:
    latitude: 0.0
    longitude: 0.0

candidate_stations:
  - query: "REPLACE WITH RER B STATION NAME"
    id: null
    label: "RER B candidate"
    required_line_id: "line:IDFM:C01743"

bicycle:
  profile: MEDIAN
  bike_type: TRADITIONAL
  average_speed_kmh: 16
  preferred_bike_minutes: 20
  max_bike_minutes: 25
  parking_buffer_minutes: 4
  target_line_id: "line:IDFM:C01743"
  target_line_label: "RER B"
  # Optional paths considered by --bike-station best. Paths may overlap;
  # each resulting station is queried only once.
  best_station_ranges:
    - {start: "Laplace", end: "Bourg-la-Reine"}
    - {start: "Bourg-la-Reine", end: "Sceaux"}

walking:
  max_minutes: 30
  max_leg_minutes: 20

scoring:
  # balanced | fastest | fewest-transfers | easy-ride | reliable
  mode: balanced
  # Optional non-negative multipliers override the selected mode. Replace {}
  # with keys such as: {transfers: 7, connection_margin: 3, freshness: 3}.
  weights: {}

state:
  # Relative paths are resolved from the directory containing this file.
  sqlite_path: "./data/commute.sqlite3"

reliability:
  fresh_age_seconds: 120
  stale_age_seconds: 300
  minimum_connection_minutes: 5
  medium_buffer_minutes: 5
  low_buffer_minutes: 10

line_queries:
  - "RER B"
  - "4602"
  - "21"
  - "22"

probe:
  coverage: fr-idf
  navitia_datetime: null
  stop_monitoring_stop_id: null
  geovelo_profile: MEDIAN
  geovelo_bike_type: TRADITIONAL
  geovelo_average_speed_kmh: 16
